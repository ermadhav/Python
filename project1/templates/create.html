{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1 class="title">Create Reel</h1>

    <form action="/create" method="POST" enctype="multipart/form-data" class="upload-card">

        <input type="hidden" name="uuid" value="{{myid}}">

        <label class="upload-box">
            <input type="file" name="images" multiple id="fileInput">
            <p>Click or Drag Images</p>
        </label>

        <div id="preview"></div>

        <textarea name="text" placeholder="Enter voice text..."></textarea>

        <button type="submit" class="btn">Generate Reel</button>

    </form>

</div>

{% endblock %}

{% block extra_js %}
<script>
const input = document.getElementById("fileInput");
const preview = document.getElementById("preview");

input.addEventListener("change", () => {
    preview.innerHTML = "";
    [...input.files].forEach(file => {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        preview.appendChild(img);
    });
});
</script>
{% endblock %}
